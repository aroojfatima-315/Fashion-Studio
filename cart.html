<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Fashion Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f8f5f2;
            color: #333;
        }
        .cart-container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }
        .cart-container h1 {
            text-align: center;
            margin-bottom: 35px;
        }
        #cart-items {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }
        .cart-item img {
            width: 100px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }
        .item-info {
            flex: 1;
        }
        .item-info h3 {
            margin-bottom: 8px;
        }
        .item-info p {
            margin-bottom: 12px;
        }
        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity button {
            width: 30px;
            height: 30px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 5px;
        }
        .remove-btn {
            border: none;
            background: #222;
            color: white;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }
        .cart-total {
            text-align: right;
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }
        .empty-cart {
            text-align: center;
            padding: 40px;
            font-size: 20px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        @media (max-width: 600px) {
            .cart-item {
                flex-wrap: wrap;
            }
            .cart-item img {
                width: 80px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <h1>🛒 Your Cart</h1>
        <div id="cart-items"></div>
        <div class="cart-total">
            Total: Rs. <span id="cart-total">0</span>
        </div>
        <a href="index.html" class="back-btn">Continue Shopping</a>
    </div>
    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        function displayCart() {
            const cartItems = document.getElementById("cart-items");
            const totalElement = document.getElementById("cart-total");
            cartItems.innerHTML = "";
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="empty-cart">
                        Your cart is empty 🛍️
                        <br>
                        <a href="index.html" class="back-btn">
                            Start Shopping
                        </a>
                    </div>
                `;
                totalElement.textContent = "0";
                return;
            }
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                cartItems.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <p>Rs. ${item.price}</p>
                            <div class="quantity">
                                <button onclick="decreaseQuantity(${index})">−</button>
                                <span>${item.quantity}</span>
                                <button onclick="increaseQuantity(${index})">+</button>
                            </div>
                        </div>
                        <button class="remove-btn"
                            onclick="removeItem(${index})">
                            Remove
                        </button>
                    </div>
                `;
            });
            totalElement.textContent = total;
        }
        function increaseQuantity(index) {
            cart[index].quantity++;
            saveCart();
        }
        function decreaseQuantity(index) {
            if (cart[index].quantity > 1) {
                cart[index].quantity--;
            } else {
                cart.splice(index, 1);
            }
            saveCart();
        }
        function removeItem(index) {
            cart.splice(index, 1);
            saveCart();
        }
        function saveCart() {
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }
        displayCart();
    </script>
</body>
</html>
