<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Fashion Studio</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #faf7f5;
    color: #333;
}

.cart-container {
    width: 90%;
    max-width: 1100px;
    margin: 60px auto;
}

.cart-container h1 {
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    margin-bottom: 40px;
}

#cart-items {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 25px;
    padding: 25px 0;
    border-bottom: 1px solid #eee;
}

.cart-item:last-child {
    border-bottom: none;
}

.cart-item img {
    width: 120px;
    height: 150px;
    object-fit: cover;
    border-radius: 15px;
}

.item-info {
    flex: 1;
}

.item-info h3 {
    font-family: 'Playfair Display', serif;
    font-size: 23px;
    margin-bottom: 8px;
}

.item-info p {
    font-size: 16px;
    margin-bottom: 15px;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 12px;
}

.quantity button {
    width: 32px;
    height: 32px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
}

.quantity button:hover {
    background: #222;
    color: white;
}

.quantity span {
    font-weight: 500;
}

.remove-btn {
    border: none;
    background: transparent;
    color: #8a1430;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
}

.remove-btn:hover {
    text-decoration: underline;
}

.cart-total {
    text-align: right;
    margin-top: 30px;
    font-size: 25px;
    font-weight: 600;
}

.back-btn {
    display: inline-block;
    margin-top: 25px;
    padding: 13px 28px;
    background: #222;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    transition: 0.3s;
}

.back-btn:hover {
    transform: translateY(-2px);
    background: #444;
}

.empty-cart {
    text-align: center;
    padding: 50px;
    font-size: 20px;
}

@media (max-width: 600px) {

    .cart-container {
        width: 94%;
        margin: 35px auto;
    }

    .cart-container h1 {
        font-size: 32px;
    }

    #cart-items {
        padding: 20px;
    }

    .cart-item {
        gap: 15px;
        flex-wrap: wrap;
    }

    .cart-item img {
        width: 90px;
        height: 115px;
    }

    .item-info h3 {
        font-size: 19px;
    }

    .remove-btn {
        margin-left: auto;
    }
}
.checkout-area {
    text-align: right;
    margin-top: 20px;
}

.checkout-btn {
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    background: #6d0f24;
    color: white;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.checkout-btn:hover {
    background: #8a1430;
    transform: translateY(-2px);
}
    </style>
</head>
<body>
    <div class="cart-container">
        <h1>🛒 Your Cart</h1>
        <div id="cart-items"></div>
        <div class="cart-total">
            Total: Rs. <span id="cart-total">0</span>
        </div>
        <div class="checkout-area">
    <button class="checkout-btn" onclick="checkout()">
        Proceed to Checkout ✨
    </button>
</div>
        <a href="index.html" class="back-btn">Continue Shopping</a>
    </div>
    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        function displayCart() {
            const cartItems = document.getElementById("cart-items");
            const totalElement = document.getElementById("cart-total");
            cartItems.innerHTML = "";
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="empty-cart">
                        Your cart is empty 🛍️
                        <br>
                        <a href="index.html" class="back-btn">
                            Start Shopping
                        </a>
                    </div>
                `;
                totalElement.textContent = "0";
                return;
            }
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                cartItems.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <p>Rs. ${item.price}</p>
                            <div class="quantity">
                                <button onclick="decreaseQuantity(${index})">−</button>
                                <span>${item.quantity}</span>
                                <button onclick="increaseQuantity(${index})">+</button>
                            </div>
                        </div>
                        <button class="remove-btn"
                            onclick="removeItem(${index})">
                            Remove
                        </button>
                    </div>
                `;
            });
            totalElement.textContent = total;
        }
        function increaseQuantity(index) {
            cart[index].quantity++;
            saveCart();
        }
        function decreaseQuantity(index) {
            if (cart[index].quantity > 1) {
                cart[index].quantity--;
            } else {
                cart.splice(index, 1);
            }
            saveCart();
        }
        function removeItem(index) {
            cart.splice(index, 1);
            saveCart();
        }
        function saveCart() {
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }
        displayCart();
        function checkout() {

    if (cart.length === 0) {
        alert("Your cart is empty! 🛍️");
        return;
    }

    alert("Thank you for shopping with Fashion Studio! ✨ Your order has been placed.");

    localStorage.removeItem("cart");

    displayCart();
}
    </script>
</body>
</html>
