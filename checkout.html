<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Fashion Studio</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .checkout-page {
            max-width: 1000px;
            margin: 60px auto;
            padding: 20px;
        }

        .checkout-page h1 {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            margin-bottom: 40px;
        }

        .checkout-box {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .checkout-box h2 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        .payment-box {
            margin-top: 25px;
            padding: 18px;
            background: #faf7f5;
            border-radius: 12px;
        }

        .place-order-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: #6d0f24;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .place-order-btn:hover {
            background: #8a1430;
            transform: translateY(-2px);
        }

        @media(max-width: 600px) {
            .checkout-page {
                margin: 30px auto;
            }

            .checkout-page h1 {
                font-size: 32px;
            }

            .checkout-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">Fashion Studio</a>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="collections.html">Collections</a></li>
            <li><a href="designer.html">Designer Picks</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="cart.html">🛒 Cart</a></li>
        </ul>
    </nav>
</header>

<section class="checkout-page">

    <h1>Checkout</h1>

    <div class="checkout-box">

        <h2>Delivery Information</h2>

        <form onsubmit="placeOrder(event)">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="03XXXXXXXXX" required>
            </div>

            <div class="form-group">
                <label>City</label>
                <input type="text" id="city" placeholder="Enter your city" required>
            </div>

            <div class="form-group">
                <label>Delivery Address</label>
                <textarea id="address" placeholder="Enter your complete address" required></textarea>
            </div>

            <div class="payment-box">
                <strong>Payment Method</strong>
                <br><br>

                <label>
                    <input type="radio" name="payment" value="Cash on Delivery" checked>
                    Cash on Delivery
                </label>
            </div>

            <button type="submit" class="place-order-btn">
                Place Order ✨
            </button>

        </form>

    </div>

</section>

<script>

function placeOrder(event) {

    event.preventDefault();

    alert(
        "Thank you for shopping with Fashion Studio! ✨\n\n" +
        "Your order has been placed successfully."
    );

    localStorage.removeItem("cart");

    window.location.href = "index.html";
}

</script>

</body>
</html>
